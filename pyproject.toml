[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cedar-brain"
version = "0.1.0"
description = "CEDAR Brain — Mycelium: local backend for project understanding, skills and CLI agent workflows"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cedar-brain = "cedar_brain.__main__:main"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]

[tool.setuptools.package-data]
cedar_brain = ["fixtures/*"]
